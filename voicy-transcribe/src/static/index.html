<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>voicy-transcribe</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1rem; }
  #status { font-weight: bold; }
  #error { color: #b00020; white-space: pre-wrap; }
  #summary, #transcript { white-space: pre-wrap; background: #f5f5f5; padding: 1rem; border-radius: 4px; }
  button { padding: 0.5rem 1.5rem; }
</style>
</head>
<body>
<h1>Voicy文字起こし</h1>

<fieldset>
  <legend>音声ファイルを選択</legend>
  <input type="file" id="fileInput" accept=".mp3,.m4a,.wav">
</fieldset>

<fieldset>
  <legend>または Voicy URL（実験的）</legend>
  <input type="text" id="urlInput" placeholder="https://voicy.jp/channel/xxx/xxx" style="width: 100%;">
  <label><input type="checkbox" id="confirmCheck"> 個人利用の範囲でVoicyから音声データを取得します</label>
</fieldset>

<fieldset>
  <legend>文字起こしの速度/精度</legend>
  <select id="qualitySelect">
    <option value="fast">速い（精度は下がります）</option>
    <option value="standard" selected>標準</option>
    <option value="accurate">高精度（時間がかかります）</option>
  </select>
</fieldset>

<button id="runBtn">実行</button>

<h2>状態: <span id="status">待機中</span></h2>
<div id="error"></div>
<div id="result" style="display:none;">
  <h3>要約 <button id="copySummaryBtn" type="button">📋 コピー</button></h3>
  <div id="summary"></div>
  <h3>全文テキスト <button id="copyTranscriptBtn" type="button">📋 コピー</button></h3>
  <div id="transcript"></div>
  <p id="savedPath"></p>
</div>

<script>
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

runBtn.addEventListener('click', async () => {
  errorEl.textContent = '';
  resultEl.style.display = 'none';
  const file = document.getElementById('fileInput').files[0];
  const url = document.getElementById('urlInput').value.trim();
  const confirmed = document.getElementById('confirmCheck').checked;
  const quality = document.getElementById('qualitySelect').value;

  const form = new FormData();
  form.append('quality', quality);
  if (file) {
    form.append('file', file);
  } else if (url) {
    form.append('url', url);
    form.append('confirmed', confirmed ? 'true' : 'false');
  } else {
    errorEl.textContent = '音声ファイルを選択するか、VoicyのURLを入力して実行してください';
    return;
  }

  statusEl.textContent = '送信中...';
  const res = await fetch('/api/jobs', { method: 'POST', body: form });
  const data = await res.json();
  if (!res.ok) {
    errorEl.textContent = data.detail || '不明なエラー';
    statusEl.textContent = '待機中';
    return;
  }
  poll(data.job_id);
});

async function poll(jobId) {
  const res = await fetch(`/api/jobs/${jobId}`);
  const job = await res.json();
  statusEl.textContent = job.status;

  if (job.error_message) {
    errorEl.textContent = job.error_message;
  }

  if (job.status === 'done' || job.status === 'fallback_required' || job.status === 'error') {
    if (job.transcript_text) {
      resultEl.style.display = 'block';
      document.getElementById('summary').textContent = job.summary_text || '（要約なし）';
      document.getElementById('transcript').textContent = job.transcript_text;
      document.getElementById('savedPath').textContent = job.output_path ? `保存先: ${job.output_path}` : '';
    }
    return;
  }
  setTimeout(() => poll(jobId), 2000);
}

async function copyToClipboard(elementId, btn) {
  const text = document.getElementById(elementId).textContent;
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '✅ コピーしました';
  } catch (e) {
    btn.textContent = '❌ コピー失敗';
  }
  setTimeout(() => { btn.textContent = original; }, 1500);
}

document.getElementById('copySummaryBtn').addEventListener('click', (e) => copyToClipboard('summary', e.target));
document.getElementById('copyTranscriptBtn').addEventListener('click', (e) => copyToClipboard('transcript', e.target));
</script>
</body>
</html>
