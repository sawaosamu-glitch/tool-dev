<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>memory-assistant</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="ask-bar">
  <div class="ollama-status" id="ollamaStatus">確認中…</div>
  <form id="askForm">
    <input type="text" id="askInput" placeholder="蓄積したメモに質問する（例: コーヒー豆はどこで買うと言っていた？）" maxlength="1000" required />
    <button type="submit">相談する</button>
  </form>
  <p class="ux-guide" id="uxGuide" hidden>
    生成AIによる要約回答を使うには →
    <a href="#" id="uxGuideLink">Ollamaの導入手順を見る</a>
  </p>
  <div id="askResult" class="ask-result" hidden></div>
</header>

<section class="note-form">
  <h2>メモを登録</h2>
  <form id="noteForm">
    <input type="hidden" id="noteId" />
    <input type="text" id="noteTitle" placeholder="タイトル（省略可）" maxlength="200" />
    <textarea id="noteBody" placeholder="本文（必須）" required></textarea>
    <input type="text" id="noteTags" placeholder="タグ（カンマ区切り、省略可）" />
    <div class="form-actions">
      <button type="submit" id="noteSubmit">保存</button>
      <button type="button" id="noteCancelEdit" hidden>編集をキャンセル</button>
    </div>
  </form>
</section>

<section class="toolbar">
  <input type="text" id="searchInput" placeholder="メモを検索（3文字以上）" />
  <select id="tagFilter">
    <option value="">タグで絞り込み（すべて）</option>
  </select>
  <button id="exportMd">Markdownでエクスポート</button>
  <button id="exportJson">JSONでエクスポート</button>
</section>

<div id="backupWarning" class="backup-warning" hidden>
  バックアップに失敗しています。ディスクの空き容量を確認してください。
</div>

<main id="noteList" class="note-list"></main>

<script src="/app.js"></script>
</body>
</html>
